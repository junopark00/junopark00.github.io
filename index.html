<style>
  /* ---------- Theme tokens: follow the OS setting (dark by default, light palette when the OS prefers light) ---------- */
  :root {
    color-scheme: dark;
    --bg: #151815;
    --paper: #1E221E;
    --paper-2: #262B26;          /* inputs and secondary surfaces */
    --paper-3: #2A2020;          /* notice boxes (reddish tint) */
    --ink: #ECEFE9;
    --ink-2: #9AA39B;
    --line: #353B35;
    --red: #E2473C;
    --red-deep: #B8281F;         /* red button hover */
    --red-text: #FF7A70;         /* red for text */
    --green: #2F5D46;            /* filled chips and accent backgrounds */
    --green-text: #74C494;       /* green for text */
    --yellow: #F2C63B;
    --chip-want-bg: var(--green);      /* dark mode: filled chips read well */
    --chip-want-border: var(--green);
    --chip-want-ink: #fff;
    --map-bg: #22271F;
    --ticket-ink: #1B1F1A;       /* text on the yellow ticket stays dark regardless of theme */
    --radius: 4px;
    --font-body: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --font-small: var(--font-body);

    --map-h: 42vh;        /* map height (adjustable via the drag handle) */
  }
  @media (prefers-color-scheme: light) { :root {
    color-scheme: light;
    --bg: #F2F4EF;
    --paper: #FFFFFF;
    --paper-2: #F5F7F3;
    --paper-3: #FFF6F5;
    --ink: #1B1F1A;
    --ink-2: #5B635C;
    --line: #D8DDD4;
    --red: #D8352B;
    --red-deep: #A8231B;
    --red-text: #A8231B;
    --green: #2F5D46;
    --green-text: #2F5D46;
    --chip-want-bg: #E7EFE9;           /* light mode: soft tint instead of a heavy fill */
    --chip-want-border: #BFD3C6;
    --chip-want-ink: #2F5D46;
    --map-bg: #E3E8E0;
  } }
  * { box-sizing: border-box; }
  /* Lucide icons (inline sprite at the top of <body>) */
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
  .btn .ic { width: 15px; height: 15px; }
  .btn.big .ic { width: 20px; height: 20px; stroke-width: 2.25; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* ---------- Layout (desktop: 3-column grid / mobile: map + bottom sheet) ---------- */
  .app {
    display: grid;
    grid-template-columns: 400px minmax(0, 1fr);
    grid-template-rows: auto var(--map-h) auto minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }
  .brand {
    grid-area: 1 / 1 / 2 / 2;
    background: var(--paper);
    border-right: 1px solid var(--line);
    padding: 22px 22px 16px;
  }
  .settings {
    grid-area: 2 / 1 / 5 / 2;
    background: var(--paper);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .settings-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 6px 22px 24px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .settings .actions {
    flex: none;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  #map { grid-area: 1 / 2 / 3 / 3; width: 100%; height: 100%; background: var(--map-bg); min-height: 0; min-width: 0; }
  .handle-h { grid-area: 3 / 2 / 4 / 3; }
  .results {
    grid-area: 4 / 2 / 5 / 3;
    overflow-y: auto;
    padding: 18px 22px 60px;
    min-height: 0;
    min-width: 0;
  }
  .sheet { display: contents; }          /* on desktop the sheet is just a wrapper: its children are placed directly in the grid */
  .sheet-bar { display: none; }

  /* Floating scroll-to-top button: sticky at the bottom-right of the results scroll area */
  .totop {
    position: sticky; bottom: 14px; margin-left: auto; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; border-radius: 50%;
    background: var(--paper); border: 1px solid var(--line); color: var(--ink);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .18); cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .totop.show { opacity: 1; pointer-events: auto; transform: none; }
  .totop .ic { width: 16px; height: 16px; }
  .totop:hover { background: var(--paper-2); }

  /* ---------- Kakao login modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal[hidden] { display: none; }   /* the class display would otherwise beat the hidden attribute */
  .modal-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 28px 26px 20px; max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  }
  .modal-card .stars-demo { color: var(--yellow); font-size: 26px; letter-spacing: 4px; margin-bottom: 10px; }
  .modal-card h2 { font-size: 19px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.01em; }
  .modal-card p { font-size: 13px; color: var(--ink-2); margin: 0 0 18px; line-height: 1.5; }
  .kakao-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 12px; border: 0; border-radius: 6px; background: #FEE500; color: #191919;
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .kakao-btn:hover { filter: brightness(.96); }
  .kakao-btn .ksym { width: 18px; height: 18px; flex: none; }
  .gbtn-wrap { margin-top: 10px; display: flex; justify-content: center; min-height: 40px; max-width: 100%; overflow: hidden; }
  .gbtn-fallback {
    width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .gbtn-fallback:hover { background: var(--paper-2); }
  .modal-card .linkbtn { margin-top: 14px; }

  /* ---------- Place detail dialog ---------- */
  .detail-card { max-width: 400px; text-align: left; position: relative; max-height: 84dvh; overflow-y: auto; padding: 24px 22px 20px; }
  .dclose { position: absolute; top: 12px; right: 12px; border: 0; background: none; padding: 6px; cursor: pointer; color: var(--ink-2); display: inline-flex; }
  .dclose:hover { color: var(--ink); }
  .detail-card h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0 24px 6px 0; }
  .dmeta { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 14px; }
  .dactions { display: flex; gap: 8px; margin-bottom: 16px; }
  .dactions .btn { flex: 1; padding: 9px 8px; font-size: 13px; }
  .dsec { border-top: 1px dashed var(--line); padding-top: 14px; margin-top: 14px; }
  .dsec .dsec-t { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; margin-bottom: 8px; }
  .davg { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
  .davg .star { display: inline-flex; color: var(--line); }
  .davg .star .ic { width: 17px; height: 17px; fill: currentColor; stroke: currentColor; }
  .davg .star.on { color: var(--yellow); }
  .davg small { font-weight: 500; color: var(--ink-2); }
  .review { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .review:last-child { border-bottom: 0; }
  .review .rhead { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .review .rstars { color: var(--yellow); letter-spacing: 1px; font-size: 12px; }
  .review .rdate { font-size: 11px; color: var(--ink-2); }
  .review .rmine { font-size: 10.5px; font-weight: 700; color: var(--green-text); }
  .review .rtext { color: var(--ink); overflow-wrap: anywhere; }
  .rate-pick { display: flex; gap: 2px; margin-bottom: 8px; }
  .rate-pick .star { border: 0; background: none; padding: 3px; cursor: pointer; color: var(--line); display: inline-flex; }
  .rate-pick .star .ic { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; }
  .rate-pick .star.on { color: var(--yellow); }
  .drate textarea {
    width: 100%; min-height: 64px; padding: 9px 11px; font: inherit; font-size: 13px; resize: vertical;
    border: 1px solid var(--line); border-radius: 3px; background: var(--paper-2); color: var(--ink);
  }
  .drate textarea:focus { border-color: var(--ink); background: var(--paper); outline: none; }
  .drate-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .drate-foot small { font-size: 11.5px; color: var(--ink-2); }
  .drate-foot .btn { padding: 8px 16px; font-size: 13px; }
  .drate-notice { margin-top: 8px; font-size: 11px; color: var(--ink-2); opacity: .8; }
  .dlogin { text-align: center; padding: 6px 0; }

  /* ---------- Star ratings on cards ---------- */
  .card .stars { grid-column: 1 / -1; display: flex; align-items: center; gap: 1px; margin-top: 2px; }
  .card .stars .star { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--line); display: inline-flex; }
  .card .stars .star .ic { width: 15px; height: 15px; fill: currentColor; stroke: currentColor; }
  .card .stars .star.on { color: var(--yellow); }
  .card .stars .rc { font-size: 11.5px; color: var(--ink-2); margin-left: 6px; }
  .stars-locked { border: 0; background: none; padding: 0; font-size: 11.5px; color: var(--ink-2); cursor: pointer; font-family: inherit; }
  .stars-locked:hover { color: var(--ink); }

  /* ---------- Sort selector above the list ---------- */
  .list-tools { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .list-tools select { width: auto; padding: 6px 10px; font-size: 12.5px; border-radius: 3px; }
  .row > * { min-width: 0; }

  /* ---------- Drag handles (resize panes) ---------- */
  .handle {
    position: relative;
    background: var(--paper);
    user-select: none;
    touch-action: none;
    flex: none;
    transition: background .12s;
  }
  .handle::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: var(--line);
    transition: background .12s;
  }
  .handle:hover, .handle.dragging { background: var(--paper-2); }
  .handle:hover::before, .handle.dragging::before { background: var(--green); }
  .handle-h {
    height: 12px;
    cursor: row-resize;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .handle-h::before { width: 56px; height: 4px; }
  .handle[hidden] { display: none; }
  body.resizing { cursor: inherit; }
  body.resizing iframe, body.resizing #map { pointer-events: none; }



  /* ---------- Sidebar ---------- */
  .brand h1 {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
    color: var(--red);
  }
  .brand p { margin: 8px 0 0; color: var(--ink-2); font-family: var(--font-small); font-size: 13px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .bmc {
    display: block; margin-top: 10px; text-align: center;
    font-family: var(--font-small); font-size: 11.5px; font-weight: 500;
    color: var(--ink-2); opacity: .7; text-decoration: none; white-space: nowrap;
  }
  .bmc:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
  .auth-line { align-self: center; min-width: 0; text-align: right; font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
  .auth-line button { border: 0; background: none; padding: 0; font: inherit; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .auth-line button:hover { color: var(--ink); }
  .legal { margin-top: 6px; text-align: center; font-size: 10.5px; }
  .legal a { color: var(--ink-2); opacity: .55; text-decoration: none; }
  .legal a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 2px; }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .label {
    font-family: var(--font-small);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .label small { font-weight: 400; letter-spacing: 0; color: var(--ink-2); margin-left: 4px; font-size: 12px; }
  .label > span { display: inline-flex; align-items: center; gap: 6px; }
  .row { display: flex; gap: 8px; }
  input[type="text"], input[type="number"], input[type="password"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-2);
  }
  input:focus, select:focus { border-color: var(--ink); background: var(--paper); }
  /* Radius row: icon | 걸어서 [n 분] | 반경 hint */
  .radius-row { display: flex; align-items: center; gap: 8px; }
  .radius-row > .ic { color: var(--ink-2); flex: none; }
  .walk-label { font-size: 13px; }
  .minutes { position: relative; width: 82px; flex: none; display: block; }
  .minutes input { padding: 5px 26px 5px 10px; text-align: right; font-family: var(--font-small); font-weight: 700; font-size: 13px; border-radius: 3px; }
  .minutes span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-size: 12px; pointer-events: none; }
  .radius-row #radiusHint { margin-left: auto; font-size: 12px; color: var(--ink-2); }
  .linkbtn { border: 0; background: none; padding: 0; font-size: 12px; color: var(--ink-2); font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
  .linkbtn:hover { color: var(--ink); }

  /* Location row: pin icon | current label (click → search input) | locate button */
  .loc-row { position: relative; display: flex; align-items: center; gap: 8px; }
  .loc-row > .ic { color: var(--ink-2); flex: none; }
  /* The label doubles as the search trigger — style it exactly like an input box */
  .loc-label {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper-2); border-radius: 3px;
    padding: 5px 10px; cursor: text; font: inherit; font-size: 13px; color: var(--ink); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .loc-label:hover, .loc-label:focus { border-color: var(--ink); background: var(--paper); outline: none; }
  .loc-label span:empty::before { content: "주소·장소 검색 (예: 강남역)"; color: var(--ink-2); }
  .loc-row input { flex: 1; min-width: 0; padding: 5px 10px; font-size: 13px; border-radius: 3px; }
  .loc-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .2); max-height: 240px; overflow-y: auto;
  }
  .loc-results button {
    display: block; width: 100%; text-align: left; padding: 9px 12px; border: 0; background: none; cursor: pointer;
    font: inherit; border-bottom: 1px solid var(--line); color: var(--ink);
  }
  .loc-results button:last-child { border-bottom: 0; }
  .loc-results button:hover, .loc-results button:focus { background: var(--paper-2); }
  .loc-results button b { display: block; font-size: 13px; font-weight: 700; }
  .loc-results button span { display: block; font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .loc-results .loc-empty { padding: 12px; font-size: 12.5px; color: var(--ink-2); text-align: center; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    font-size: 13.5px;
    font-weight: 600;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip { touch-action: none; user-select: none; -webkit-user-select: none; display: inline-flex; align-items: center; gap: 4px; }
  .chip.want { background: var(--chip-want-bg); border-color: var(--chip-want-border); color: var(--chip-want-ink); }
  .chip.no { border-style: dashed; border-color: var(--red-text); color: var(--red-text); }
  .chip.hist { background: var(--paper); border-color: var(--line); color: var(--ink); font-size: 12.5px; padding: 4px 9px; font-weight: 500; }
  .chip.hist.cur { border-color: var(--yellow); background: rgba(242,198,59,.18); }
  .chip .rm { display: inline-flex; opacity: .55; line-height: 1; padding: 0 0 0 2px; }
  .chip .rm .ic { width: 12px; height: 12px; stroke-width: 2.5; }
  .chip .rm:hover { opacity: 1; }
  .chip.lifting { opacity: .3; }
  .chip.ghost {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0;
    box-shadow: 0 10px 24px rgba(0,0,0,.35); transform: scale(1.06);
  }
  body.dragging-chip { cursor: grabbing; }
  body.dragging-chip * { cursor: grabbing !important; }

  /* Want / Don't-want zones — rendered as a single component */
  .zones {
    display: grid; grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--paper-2);
  }
  .zone {
    padding: 9px 9px 10px;
    min-height: 118px;
    display: flex; flex-direction: column; gap: 8px;
    transition: background .12s;
    min-width: 0;
  }
  .zone.no { border-left: 1px dashed var(--line); }
  .zone .zh { font-size: 12px; font-weight: 700; display: flex; flex-direction: column; gap: 1px; }
  .zone .zh small { font-family: var(--font-small); font-weight: 400; color: var(--ink-2); font-size: 11px; }
  .zone .zh > span { display: inline-flex; align-items: center; gap: 5px; }
  .zone.want .zh > span { color: var(--green-text); }
  .zone.no .zh > span { color: var(--red-text); }
  .zone .chips { flex: 1; align-content: flex-start; min-height: 32px; position: relative; }
  .zone .chips:empty::before {
    content: attr(data-empty);
    font-size: 12px; color: var(--ink-2); opacity: .7;
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .zone.want.over { background: rgba(47,93,70,.18); box-shadow: inset 0 0 0 2px var(--green); }
  .zone.no.over { background: rgba(216,53,43,.14); box-shadow: inset 0 0 0 2px var(--red); }
  .zone-input {
    grid-column: 1 / -1;
    display: flex; gap: 8px; align-items: center;
    padding: 8px;
    border-top: 1px dashed var(--line);
    background: var(--paper);
  }
  .zone-input .ic { color: var(--ink-2); margin-left: 4px; }
  .zone-input input[type="text"] { flex: 1; min-width: 0; padding: 7px 10px; font-size: 13px; border-radius: 3px; }

  .btn {
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-weight: 700;
  }
  .btn.secondary { background: var(--paper); color: var(--ink); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.red:hover:not(:disabled) { background: var(--red-deep); border-color: var(--red-deep); }



  .status { font-family: var(--font-small); font-size: 13px; color: var(--ink-2); }
  .status[hidden] { display: none; }
  .field[hidden] { display: none; }
  .status.error { color: var(--red-text); font-weight: 600; }

  /* ---------- Ticket (signature): idle (pick button only) → rolling (reel) → done (result) ---------- */
  .ticket {
    position: relative;
    background: var(--yellow);
    color: var(--ticket-ink);
    border-radius: 2px;
    padding: 20px 26px;
    margin-bottom: 16px;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
  }
  .ticket > * { min-width: 0; }
  .ticket .t-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ticket .t-count { font-size: 12.5px; color: rgba(27,31,26,.75); font-family: var(--font-small); }
  .ticket[data-state="idle"] .name, .ticket[data-state="idle"] .meta, .ticket[data-state="idle"] .t-done { display: none; }
  .ticket .t-note { display: none; font-size: 11px; color: rgba(27, 31, 26, .55); margin-top: 4px; }
  .ticket[data-state="done"] .t-note { display: block; }
  .ticket.real-walk .t-note { display: none; }   /* actual TMAP time shown → no disclaimer needed */
  .ticket[data-state="rolling"] .t-idle, .ticket[data-state="done"] .t-idle { display: none; }
  .ticket[data-state="rolling"] .t-done { pointer-events: none; opacity: .55; }
  .ticket[hidden] { display: none; }
  .ticket[data-state="idle"] { padding: 18px 26px; }
  .ticket .btn.big { font-family: var(--font-body); font-weight: 800; font-size: 20px; padding: 12px 28px; letter-spacing: -.01em; border-radius: 3px; }
  .ticket .t-done { padding-left: 18px; border-left: 1px dashed rgba(27,31,26,.35); }   /* perforation between stub and actions */
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    top: 50%; width: 26px; height: 26px;
    background: var(--bg);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .ticket::before { left: -13px; }
  .ticket::after { right: -13px; }
  .ticket .eyebrow {
    font-family: var(--font-small); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--red-deep);
  }
  .ticket[data-state="idle"] .eyebrow { font-family: var(--font-body); font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .ticket .name {
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(30px, 4vw, 48px);
    line-height: 1.05;
    margin: 4px 0 6px;
    word-break: keep-all;
  }
  /* Slot-machine reel: names scroll downward inside a one-line-tall window */
  .ticket .reel {
    position: relative;
    height: 1.15em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
  }
  .ticket .reel:not(.spinning) { -webkit-mask-image: none; mask-image: none; }
  .ticket .reel-strip { will-change: transform; }
  .ticket .reel-item {
    height: 1.15em;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ticket .reel-item > span { overflow: hidden; text-overflow: ellipsis; }
  .ticket .reel.landed .reel-item:first-child { animation: reelLand .38s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes reelLand {
    0%   { transform: translateY(-14%); }
    60%  { transform: translateY(5%); }
    100% { transform: translateY(0); }
  }
  .ticket .meta { font-family: var(--font-small); font-size: 13px; color: var(--ticket-ink); font-weight: 700; }
  .ticket .meta span + span::before { content: " · "; color: rgba(27,31,26,.5); }
  .ticket .actions { display: flex; flex-direction: column; gap: 8px; }
  .ticket .actions .btn { padding: 10px 14px; white-space: nowrap; text-align: center; }
  /* 5 actions → 다시 뽑기 full width on top, the rest in a 2×2 grid */
  .ticket .t-done { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-content: start; }
  .ticket .t-done .btn { padding: 9px 10px; font-size: 13px; min-width: 0; }
  .ticket .t-done .btn:first-child { grid-column: 1 / -1; }
  .ticket .btn.secondary { background: #fff; border-color: #fff; color: #1B1F1A; }
  .ticket .btn.ghost { border-color: rgba(0,0,0,.25); color: var(--ticket-ink); background: transparent; }
  .ticket .btn.ghost:hover { background: rgba(0,0,0,.08); }


  /* ---------- List ---------- */
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    border-left-width: 3px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: var(--ink); }
  .card.active { border-color: var(--line); border-left-color: var(--red); background: var(--paper-2); }
  .card .n { font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere; }
  .card .dist {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 14px;
    color: var(--green-text);
    white-space: nowrap;
  }
  .card .c { grid-column: 1 / -1; font-family: var(--font-small); font-size: 12.5px; color: var(--ink-2); }
  .card .a { grid-column: 1 / -1; font-family: var(--font-small); font-size: 12px; color: var(--ink-2); }
  .card .links { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card .links a, .card .links button {
    display: inline-flex; align-items: center; height: 20px; padding: 0; margin: 0; border: 0; background: none;
    font: inherit; font-family: var(--font-small); font-size: 12px; font-weight: 700; line-height: 1; text-decoration: none; cursor: pointer; gap: 4px;
  }
  .card .links a { color: var(--green-text); }
  .card .links button { color: var(--red-text); }


  /* today's pick history */
  .history { display: flex; align-items: flex-start; gap: 8px; margin: -6px 0 16px; font-size: 12px; color: var(--ink-2); }
  .history { font-family: var(--font-small); }
  .history .h-label { flex: none; padding-top: 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 5px; }
  .history[hidden] { display: none; }

  /* empty-state actions */
  .empty .btn { margin-top: 14px; padding: 9px 16px; font-size: 13px; }
  .empty .btn + .btn { margin-left: 6px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 3px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--ink-2);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty { font-family: var(--font-small); font-size: 13.5px; }
  .empty b { color: var(--ink); display: block; font-family: var(--font-body); font-size: 17px; font-weight: 800; margin: 10px 0 6px; }
  .empty .ic { width: 28px; height: 28px; opacity: .5; }

  /* ---------- Mobile: full-bleed map with a bottom sheet holding Settings / List ---------- */
  @media (max-width: 860px) {
    body { overflow: hidden; }
    .app { display: flex; flex-direction: column; }
    .brand {
      flex: none; padding: 8px 14px 8px 18px; border-right: 0; border-bottom: 1px solid var(--line);
      padding-top: calc(8px + env(safe-area-inset-top));
    }
    .brand-row { align-items: center; }
    .brand h1 { font-size: 24px; line-height: 1.1; }
    .brand p { display: none; }
    #map { flex: 1 1 auto; height: auto; min-height: 96px; }
    .handle-h { display: none; }

    .sheet {
      display: flex; flex-direction: column;
      flex: none;
      height: var(--sheet-h, 52dvh);
      max-height: 92dvh;
      min-height: 0;
      background: var(--paper);
      border-top: 1px solid var(--line);
      border-radius: 10px 10px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,.28);
      transition: height .22s ease-out;
      position: relative; z-index: 5;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.dragging { transition: none; }
    .sheet-bar { display: block; flex: none; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
    .sheet-bar .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 2px; }
    .stabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--line); }
    .stabs button {
      flex: 1; padding: 9px 4px 10px; border: 0; background: none;
      font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
    }
    .stabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
    .stabs .tc { font-family: var(--font-small); font-weight: 700; font-size: 12px; color: var(--ink-2); margin-left: 2px; }

    .panel { display: none; }
    .panel.active { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sheet .panel[hidden] { display: none; }

    .settings { border: 0; }
    .settings.active { overflow: hidden; }
    .settings-body { padding: 14px 16px 16px; gap: 18px; }
    .settings .actions { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
    .sheet { padding-bottom: 0; }
    .brand h1 { margin: 0; }

    .results { padding: 12px 14px calc(24px + env(safe-area-inset-bottom)); }
    .results.active { display: block; }
    .totop { bottom: calc(14px + env(safe-area-inset-bottom)); }
    .ticket { grid-template-columns: minmax(0, 1fr); padding: 16px 18px; gap: 12px; }
    .ticket[data-state="idle"] { padding: 14px 18px 16px; }
    .ticket .t-idle .btn.big { width: 100%; }
    .ticket .name { font-size: 28px; }
    .ticket .t-done { padding-left: 0; border-left: 0; padding-top: 12px; border-top: 1px dashed rgba(27,31,26,.35); }
    .ticket[data-state="idle"] .t-done { display: none; }
    .ticket .t-done .btn { padding: 10px 6px; font-size: 13px; white-space: normal; line-height: 1.25; }
    .history { flex-wrap: wrap; }
    .list { grid-template-columns: 1fr; }
    .card { padding: 12px 14px; }
    .empty { padding: 32px 16px; }

  }
  @media (max-width: 380px) {
    .stabs button { font-size: 13px; }
    .ticket .name { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .chip, .card, .btn, .handle { transition: none; }
    .ticket .reel-item { animation: none; }
  }
</style>
</head>

 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" /> <path d="M7 10v12" /></symbol><symbol id="i-utensils-crossed" viewBox="0 0 24 24"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" /> <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" /> <path d="m2.1 21.8 6.4-6.3" /> <path d="m19 5-7 7" /></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol><symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></symbol></svg>
<div class="app">
  <!-- ================= Brand (desktop: top-left / mobile: top bar) ================= -->
  <header class="brand" id="brand">
    <div class="brand-row">
      <h1>점메추</h1>
      <div class="auth-line" id="authLine"></div>
    </div>
    <p>반경 안에서, 먹기 싫은 건 빼고, 하나 골라드림.</p>
  </header>

  <!-- ================= Map ================= -->
  <div id="map" role="img" aria-label="주변 음식점 지도"></div>
  <div class="handle handle-h" id="splitH" role="separator" aria-orientation="horizontal" aria-label="지도와 목록 크기 조절 (드래그 또는 ↑↓ 키)" tabindex="0" title="끌어서 지도 높이 조절 · 더블클릭하면 원래대로"></div>

  <!-- ================= Sheet: spread across the grid on desktop, a bottom sheet on mobile ================= -->
  <div class="sheet" id="sheet">
    <div class="sheet-bar" id="sheetBar">
      <div class="grip" aria-hidden="true"></div>
      <div class="stabs" role="tablist" aria-label="화면 전환">
        <button type="button" role="tab" data-panel="settings" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg>조건</button>
        <button type="button" role="tab" data-panel="results" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>목록<span class="tc" id="tabCount"></span></button>
      </div>
    </div>

    <!-- ---------- Settings ---------- -->
    <section class="panel settings active" id="panelSettings" aria-label="검색 조건">
     <div class="settings-body">
      <div class="field">
        <div class="loc-row">
          <svg class="ic" aria-hidden="true"><use href="#i-map-pin"/></svg>
          <button type="button" class="loc-label" id="locDisplay" title="클릭해서 주소·장소 검색"><span id="locHint"></span></button>
          <input type="text" id="locInput" placeholder="주소·장소 검색 (예: 강남역)" aria-label="위치 검색" autocomplete="off" enterkeyhint="search" hidden />
          <button class="btn ghost" id="geo" style="padding:6px 9px" aria-label="현재 위치 잡기" title="현재 위치 잡기"><svg class="ic" aria-hidden="true"><use href="#i-locate"/></svg></button>
          <div class="loc-results" id="locResults" hidden></div>
        </div>
      </div>

      <div class="field">
        <div class="radius-row">
          <svg class="ic" aria-hidden="true"><use href="#i-footprints"/></svg>
          <span class="walk-label">걸어서</span>
          <label class="minutes"><input type="number" id="minutes" value="5" min="1" max="20" step="1" aria-label="분" /><span>분</span></label>
          <small id="radiusHint"></small>
        </div>
      </div>

      <div class="field">
        <div class="label"><span><svg class="ic" aria-hidden="true"><use href="#i-utensils-crossed"/></svg>장르</span><button class="linkbtn" id="resetGenres" type="button">기본값</button></div>
        <div class="zones">
          <div class="zone want" data-zone="want">
            <div class="zh"><span><svg class="ic" aria-hidden="true"><use href="#i-thumbs-up"/></svg>먹고 싶은</span><small>비우면 전체</small></div>
            <div class="chips" id="wantChips" data-empty="여기로 끌어다 놓기"></div>
          </div>
          <div class="zone no" data-zone="no">
            <div class="zh"><span><svg class="ic" aria-hidden="true"><use href="#i-thumbs-down"/></svg>먹기 싫은</span><small>이름·업종에 포함되면 제외</small></div>
            <div class="chips" id="noChips" data-empty="여기로 끌어다 놓기"></div>

<script>
/* ============================================================
   Config
   - KAKAO_JS_KEY : public by design; it is protected by the site-domain list in
                    the Kakao console (플랫폼 > Web), so hardcoding it is fine.
   - SEARCH_PROXY : Cloudflare Worker URL (worker/worker.js) that holds the REST
                    key as a secret and only answers to the allowed origins.
                    Leave empty to search through the JS SDK instead.
   - KAKAO_REST_KEY : local testing only. Never commit a real REST key — it has no
                    domain restriction. Empty → the app searches via the JS SDK.
   ============================================================ */
const KAKAO_JS_KEY   = "915c35e47a9ec22fe51b99e9be2e3532";
const GOOGLE_CLIENT_ID = "461639910588-72hlpadstkq8idus5jvi256113pqok29.apps.googleusercontent.com";
const SEARCH_PROXY   = "https://jummechu-api.td-junopark.workers.dev/search";
const KAKAO_REST_KEY = "";

const GENRES = ["한식","중식","일식","양식","아시안"];
const MAX_RADIUS_M = 20000;   // Kakao API upper limit
const MAX_PAGES = 3;          // up to 45 results per keyword

const $ = (id) => document.getElementById(id);
const ICON = (name, cls = "") => `<svg class="ic${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const state = {
  center: null,        // {lat, lng}
  genres: new Set(GENRES),   // default: every genre starts in "want"
  excludes: new Set(),
  places: [],          // list after filters are applied
  map: null, ps: null,
  markers: [], centerMarker: null, circle: null, info: null,
  picked: null, activeId: null,
  skips: new Set(),    // store names skipped for today only (not persisted across days)
  recent: [],          // last few picked ids, avoided on re-pick
  history: [],         // today's picks
};

/* ---------- Persistence ---------- */
const PREFS_KEY = "jmc-prefs", TODAY_KEY = "jmc-today";
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function loadJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function savePrefs() {
  saveJSON(PREFS_KEY, { genres: [...state.genres], excludes: [...state.excludes], minutes: $("minutes").value, sort: $("sortSel").value });
}
function saveToday() { saveJSON(TODAY_KEY, { date: todayStr(), skips: [...state.skips], history: state.history, recent: state.recent }); }
function loadPersisted() {
  const pr = loadJSON(PREFS_KEY, null);
  if (pr) {
    if (Array.isArray(pr.genres)) state.genres = new Set(pr.genres);
    if (Array.isArray(pr.excludes)) state.excludes = new Set(pr.excludes);
    if (pr.minutes >= 1) $("minutes").value = clampMinutes(pr.minutes);
    if (pr.sort && [...$("sortSel").options].some(o => o.value === pr.sort)) $("sortSel").value = pr.sort;
  }
  const td = loadJSON(TODAY_KEY, null);
  if (td && td.date === todayStr()) {
    state.skips = new Set(td.skips || []); state.history = td.history || []; state.recent = td.recent || [];
  }
}

/* ---------- Chip UI: want / don't-want ---------- */
// A token lives in exactly one of state.genres ("want"), state.excludes ("no") or state.skips (today-only "no")
function moveToken(t, zone) {
  state.genres.delete(t); state.excludes.delete(t); state.skips.delete(t);
  (zone === "no" ? state.excludes : state.genres).add(t);
  renderTokens(); applyFilter();
}
function deleteToken(t) {
  state.genres.delete(t); state.excludes.delete(t); state.skips.delete(t);
  renderTokens(); applyFilter();
}
function skipPlace(name) { state.skips.add(name); renderTokens(); applyFilter(); }
function resetGenres() {
  GENRES.forEach(g => { if (!state.excludes.has(g)) state.genres.add(g); });
  renderTokens(); applyFilter();
}
$("resetGenres").onclick = resetGenres;
function makeChip(t, zone, extraClass = "") {
  const b = document.createElement("button");
  b.type = "button"; b.className = ("chip " + zone + " " + extraClass).trim();
  b.dataset.token = t; b.dataset.from = zone;
  b.title = "끌어서 옮기기 · 클릭하면 반대쪽으로";
  const label = document.createElement("span"); label.textContent = t; b.appendChild(label);
  const rm = document.createElement("span"); rm.className = "rm"; rm.innerHTML = ICON("x"); rm.title = "지우기";
  b.appendChild(rm);
  b.onkeydown = e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); moveToken(t, "want"); }
    else if (e.key === "ArrowRight") { e.preventDefault(); moveToken(t, "no"); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteToken(t); }
  };
  enableChipDrag(b, t, zone);
  return b;
}
function renderTokens() {
  const want = $("wantChips"), no = $("noChips");
  want.innerHTML = no.innerHTML = "";
  state.genres.forEach(t => want.appendChild(makeChip(t, "want")));
  state.excludes.forEach(t => no.appendChild(makeChip(t, "no")));
  state.skips.forEach(t => { const c = makeChip(t, "no", "skip"); c.title = "오늘만 제외 · 끌어서 옮기기"; no.appendChild(c); });
  savePrefs(); saveToday();
}
const renderGenres = renderTokens, renderExcludes = renderTokens;

// Pointer-event based drag (works for both mouse and touch)
function zoneAt(x, y) { return document.elementFromPoint(x, y)?.closest("[data-zone]") || null; }
function enableChipDrag(chip, token, fromZone) {
  chip.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    const offX = e.clientX - chip.getBoundingClientRect().left, offY = e.clientY - chip.getBoundingClientRect().top;
    let started = false, ghost = null, over = null;
    const setOver = z => {
      if (over === z) return;
      over?.classList.remove("over"); z?.classList.add("over"); over = z;
    };
    const move = ev => {
      if (!started) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        started = true;
        chip.setPointerCapture(pid);
        ghost = chip.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("lifting");
        document.body.appendChild(ghost);
        chip.classList.add("lifting"); document.body.classList.add("dragging-chip");
      }
      ghost.style.transform = `translate(${ev.clientX - offX}px, ${ev.clientY - offY}px) scale(1.06)`;
      setOver(zoneAt(ev.clientX, ev.clientY));
    };
    const end = ev => {
      chip.removeEventListener("pointermove", move);
      chip.removeEventListener("pointerup", end);
      chip.removeEventListener("pointercancel", end);
      if (!started) {
        // plain click, no drag
        if (ev.type === "pointerup") {
          if (ev.target.closest(".rm")) deleteToken(token);
          else moveToken(token, fromZone === "want" ? "no" : "want");
        }
        return;
      }
      ghost?.remove(); chip.classList.remove("lifting"); document.body.classList.remove("dragging-chip");
      const z = ev.type === "pointerup" ? zoneAt(ev.clientX, ev.clientY) : null;
      setOver(null);
      if (z && z.dataset.zone !== fromZone) moveToken(token, z.dataset.zone);
    };
    chip.addEventListener("pointermove", move);
    chip.addEventListener("pointerup", end);
    chip.addEventListener("pointercancel", end);
  });
}

// Free-text input: comma-separated, committed to "want" on Enter or blur (Shift+Enter → "don't want")
function commitInput(toNo = false) {
  const el = $("genreInput");
  const toks = el.value.split(",").map(s => s.trim()).filter(Boolean);
  if (!toks.length) return;
  el.value = "";
  const zone = toNo ? "no" : "want";
  toks.forEach(t => { state.genres.delete(t); state.excludes.delete(t); state.skips.delete(t); (zone === "no" ? state.excludes : state.genres).add(t); });
  renderTokens(); applyFilter();
}
function commitInputs() { commitInput(); }
$("genreInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commitInput(e.shiftKey); } });
$("genreInput").addEventListener("blur", () => commitInput());

/* ---------- Radius: travel mode × minutes ---------- */
const MODES = {
  walk:  { label: "걸어서",  mpm: 67 },     // ~4 km/h
};
const MAX_MINUTES = 20;   // 걸어서 20분 = 반경 ~1.34km 상한
function clampMinutes(v) { return Math.max(1, Math.min(MAX_MINUTES, parseFloat(v) || 1)); }
function currentMode() { return MODES.walk; }
function rawRadius() { return currentMode().mpm * clampMinutes($("minutes").value); }
function radiusMeters() {
  const m = Math.round(rawRadius() / 10) * 10;
  return Math.max(10, Math.min(MAX_RADIUS_M, m));
}
function travelLabel(dist) {
  const mo = currentMode();
  return `${mo.label} 약 ${Math.max(1, Math.round(dist / mo.mpm))}분`;
}
function updateRadiusHint() {
  const capped = (parseFloat($("minutes").value) || 1) >= MAX_MINUTES;
  $("radiusHint").textContent = `반경 ${fmtDist(radiusMeters())}${capped ? " (최대)" : ""}`;
  drawCircle();
  if (state.picked) fillTicketMeta(state.picked);
}
$("minutes").addEventListener("input", () => {
  const el = $("minutes");
  if (parseFloat(el.value) > MAX_MINUTES) el.value = MAX_MINUTES;
  updateRadiusHint(); markDirty(); savePrefs();
});
$("minutes").addEventListener("blur", () => { const v = clampMinutes($("minutes").value); if (String(v) !== $("minutes").value) { $("minutes").value = v; updateRadiusHint(); } });

/* ---------- Status display ---------- */
// Shown only for errors; progress is conveyed through the button label
function setStatus(msg, isError = false) {
  const s = $("status");
  s.hidden = !isError; s.textContent = isError ? msg : ""; s.className = "status" + (isError ? " error" : "");
}
let searchDirty = false;
function setSearchBusy(v, label) {
  const b = $("search"); b.disabled = v; $("searchLabel").textContent = v ? (label || "찾는 중…") : "이 조건으로 찾기";
}
// After a search, flag changed location/radius via the button label
function markDirty() {
  if (!state.all || searchDirty || $("search").disabled) return;
  searchDirty = true; $("searchLabel").textContent = "바뀐 조건으로 다시 찾기";
}

/* ---------- SDK loading ---------- */
// Key/domain problems are reported only in the status area (no setup component)
function loadSdk(key) {
  if (!key) { setStatus("카카오 JavaScript 키가 없어요. 파일 상단 KAKAO_JS_KEY에 넣어주세요.", true); return; }
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
  s.onload = () => { try { kakao.maps.load(initMap); } catch (e) { setStatus("카카오맵 초기화 실패: " + e.message, true); } };
  s.onerror = () => setStatus("카카오맵 SDK를 못 불러왔어요. 키가 맞는지, 카카오 콘솔에 이 페이지 도메인이 등록됐는지 확인하세요.", true);
  document.head.appendChild(s);
}

function initMap() {
  const fallback = { lat: 37.5665, lng: 126.9780 }; // Seoul City Hall
  state.map = new kakao.maps.Map($("map"), { center: new kakao.maps.LatLng(fallback.lat, fallback.lng), level: 4 });
  state.ps = new kakao.maps.services.Places();
  state.geocoder = new kakao.maps.services.Geocoder();
  state.info = new kakao.maps.InfoWindow({ zIndex: 2, removable: true });
  kakao.maps.event.addListener(state.map, "click", e => setCenter(e.latLng.getLat(), e.latLng.getLng(), "지도에서 찍은 지점"));
  // Re-layout the map when the pane is resized so it doesn't distort
  new ResizeObserver(() => {
    if (!state.map) return;
    const c = state.map.getCenter();
    state.map.relayout(); state.map.setCenter(c);
  }).observe($("map"));
  $("search").disabled = false;
  setStatus("연결됐어요.");
  autoLocate();
}

/* ---------- Location ---------- */
// Browsers don't remember permissions for pages opened via file://, so they prompt every time (http://localhost is remembered).
// So we persist the last location and only auto-refresh the current position when permission is already granted.
const LOC_KEY = "jmc-loc";
function saveLoc(lat, lng) { try { localStorage.setItem(LOC_KEY, JSON.stringify({ lat, lng, t: Date.now() })); } catch {} }
function loadLoc() { try { return JSON.parse(localStorage.getItem(LOC_KEY) || "null"); } catch { return null; } }
async function permissionState() {
  try { return (await navigator.permissions.query({ name: "geolocation" })).state; } catch { return "unknown"; }
}
async function autoLocate() {
  const saved = loadLoc();
  if (saved) setCenter(saved.lat, saved.lng, "마지막 위치");   // instant placeholder while GPS resolves
  const perm = await permissionState();
  if (perm === "denied") {
    setStatus(IN_APP
      ? "인앱 브라우저에서는 위치 권한이 제한돼요. 위치 검색을 이용하거나 브라우저 메뉴에서 '외부 브라우저로 열기'를 눌러주세요."
      : "위치 권한이 차단돼 있어요. 주소창 자물쇠에서 허용하거나 지도를 클릭하세요.", true);
    return;
  }
  locate();   // granted or not-yet-asked → grab the current position right away
}
function locate() {
  if (!navigator.geolocation) { setStatus("이 브라우저는 위치를 지원하지 않아요. 지도를 클릭해 기준점을 정하세요.", true); return; }
  if (!state.map) { setStatus("지도가 아직 준비되지 않았어요.", true); return; }
  const geo = $("geo"); geo.disabled = true;
  navigator.geolocation.getCurrentPosition(
    p => { setCenter(p.coords.latitude, p.coords.longitude, "현재 위치"); saveLoc(p.coords.latitude, p.coords.longitude); setStatus(""); geo.disabled = false; },
    err => {
      const msg = { 1: "위치 권한이 거부됐어요. 주소창 자물쇠 아이콘에서 허용할 수 있어요.", 2: "위치를 알아낼 수 없어요.", 3: "위치 확인이 너무 오래 걸려요." }[err.code] || "위치를 못 잡았어요.";
      setStatus(msg + (IN_APP
        ? " 인앱 브라우저에서는 위치 권한이 제한돼요. 위치 검색을 이용하거나 브라우저 메뉴에서 '외부 브라우저로 열기'를 눌러주세요."
        : " 지도를 클릭해 기준점을 정할 수도 있어요."), true);
      geo.disabled = false;
    },
    { enableHighAccuracy: false, maximumAge: 5 * 60 * 1000, timeout: 10000 }
  );
}
$("geo").onclick = () => locate();

/* ---------- Location search (keyword + address, both via the Kakao JS SDK) ---------- */
function searchLocation(q) {
  return new Promise(resolve => {
    const out = { places: [], addrs: [] };
    let pending = 2;
    const done = () => { if (--pending === 0) resolve([...out.places, ...out.addrs]); };
    state.ps.keywordSearch(q, (data, status) => {
      if (status === kakao.maps.services.Status.OK)
        out.places = data.slice(0, 5).map(d => ({ name: d.place_name, addr: d.road_address_name || d.address_name || "", lat: +d.y, lng: +d.x }));
      done();
    }, { size: 5 });
    state.geocoder.addressSearch(q, (res, status) => {
      if (status === kakao.maps.services.Status.OK)
        out.addrs = res.slice(0, 3).map(d => ({
          name: (d.road_address && d.road_address.building_name) || d.address_name, addr: d.address_name, lat: +d.y, lng: +d.x }));
      done();
    });
  });
}
// The label doubles as the search trigger: click → input appears, blur/pick → label returns
function locSearchMode(on) {
  $("locDisplay").hidden = on;
  $("locInput").hidden = !on;
  if (on) { $("locInput").value = ""; $("locInput").focus(); }
  else $("locResults").hidden = true;
}
$("locDisplay").onclick = () => locSearchMode(true);
let locTimer = null, locQuerySeq = 0;
async function runLocSearch() {
  const q = $("locInput").value.trim();
  if (q.length < 2 || !state.ps || !state.geocoder) return;
  const seq = ++locQuerySeq;
  const items = await searchLocation(q);
  if (seq !== locQuerySeq || $("locInput").hidden) return;   // stale response or search already closed
  const seen = new Set();

// 1st choice: call the REST API directly (errors surface as HTTP codes and messages)
// 2nd choice: fall back to the JS SDK Places service when no REST key is set
async function restSearch(path, params) {
  // Through the worker (key stays server-side) or directly with a local REST key
  const url = new URL(SEARCH_PROXY ? `${SEARCH_PROXY.replace(/\/$/, "")}/${path}` : "https://dapi.kakao.com/v2/local/search/" + path);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, SEARCH_PROXY ? {} : { headers: { Authorization: "KakaoAK " + KAKAO_REST_KEY } });
  const body = await res.json().catch(() => ({}));
  console.log(`[점메추] REST ${path} → ${res.status}`, body);
  if (!res.ok) throw new Error(`HTTP ${res.status} ${body.message || body.msg || body.errorType || ""}`.trim());
  return body;
}
// Live tally on the search button while grid sub-searches are collecting
let searchTally = -1;   // ≥0 while a search is in flight
function bumpTally(n) {
  if (searchTally < 0 || !n) return;
  searchTally += n;
  $("searchLabel").textContent = `찾는 중… ${searchTally}곳`;
}
async function restPaged(path, params) {
  const acc = [];
  for (let page = 1; page <= MAX_PAGES; page++) {
    const body = await restSearch(path, { ...params, page });
    acc.push(...(body.documents || []));
    bumpTally((body.documents || []).length);
    if (!body.meta || body.meta.is_end) break;
  }
  return acc;
}
function sdkPaged(label, opts, fn) {
  return new Promise((resolve, reject) => {
    const acc = []; let page = 1;
    const cb = (data, status, pagination) => {
      console.log(`[점메추] SDK "${label}" p${page} → ${status}`, data);
      if (status === kakao.maps.services.Status.OK) {
        acc.push(...data);
        bumpTally(data.length);
        if (pagination && pagination.hasNextPage && page < MAX_PAGES) { page++; pagination.nextPage(); return; }
        resolve(acc);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) resolve(acc);
      else reject(new Error(`SDK 응답 상태: ${status} (REST API 키를 넣으면 정확한 원인이 보여요)`));
    };
    fn(cb);
  });
}

// Kakao caps every query at MAX_PAGES×15 results, so a saturated query only ever
// shows the same subset no matter the radius. Two countermeasures:
//   - sort=accuracy instead of distance, so the capped subset isn't always the nearest 45
//   - when a query saturates, re-run it over 7 half-radius sub-circles (center + hex ring)
const PAGE_CAP = MAX_PAGES * 15;
function haversine(lat1, lng1, lat2, lng2) {
  const rad = Math.PI / 180, R = 6371000;
  const a = Math.sin((lat2 - lat1) * rad / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lng2 - lng1) * rad / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
// 6 centers at distance r·√3/2: with radius r/2 they tile the original circle exactly
function subCenters(lat, lng, r) {
  const d = r * Math.sqrt(3) / 2;
  return [0, 60, 120, 180, 240, 300].map(deg => {
    const t = deg * Math.PI / 180;
    return [lat + (d * Math.cos(t)) / 111320, lng + (d * Math.sin(t)) / (111320 * Math.cos(lat * Math.PI / 180))];
  });
}
function searchJob(q, lat, lng, r) {
  if (SEARCH_PROXY || KAKAO_REST_KEY) {
    const base = { x: lng, y: lat, radius: r, sort: "accuracy", size: 15, category_group_code: "FD6" };
    return q === null ? restPaged("category.json", base) : restPaged("keyword.json", { ...base, query: q });
  }
  const opts = { location: new kakao.maps.LatLng(lat, lng), radius: r, size: 15, sort: kakao.maps.services.SortBy.ACCURACY };
  return q === null
    ? sdkPaged("전체 음식점", opts, cb => state.ps.categorySearch("FD6", cb, opts))
    : sdkPaged(q, opts, cb => state.ps.keywordSearch(q, cb, { ...opts, category_group_code: "FD6" }));
}
async function searchArea(q, lat, lng, r, depth = 0) {
  const acc = await searchJob(q, lat, lng, r);
  if (acc.length < PAGE_CAP || depth >= 1 || r <= 200) return acc;
  const centers = [[lat, lng], ...subCenters(lat, lng, r)];
  const parts = await Promise.all(centers.map(([la, ln]) => searchArea(q, la, ln, Math.ceil(r / 2), depth + 1)));
  return [acc, ...parts].flat();
}
// With includeAll, run an "all restaurants" category search and layer keyword searches on top.
async function fetchPlaces(keywords, r, includeAll) {
  const { lat, lng } = state.center;
  const jobs = [];
  if (includeAll) jobs.push(searchArea(null, lat, lng, r));
  keywords.forEach(q => jobs.push(searchArea(q, lat, lng, r)));
  const raw = (await Promise.all(jobs)).flat();
  // Sub-circles stick out past the original radius, and accuracy sort makes the API's
  // per-query distance meaningless — recompute from the real center and clip to r.
  return raw.map(p => ({ ...p, distance: Math.round(haversine(lat, lng, +p.y, +p.x)) }))
    .filter(p => p.distance <= r);
}

// Marker images: blue pins for every result, a larger yellow pin for the selected / picked place
const markerImages = {};
function pinSvg(w, h, fill, stroke) {   // classic teardrop pin, tip at the bottom centre

    `<path d="M12 28.5C12 28.5 2.5 17.5 2.5 11a9.5 9.5 0 0 1 19 0c0 6.5-9.5 17.5-9.5 17.5z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>` +

/* ---------- Mobile bottom sheet ---------- */
const mobileMQ = matchMedia("(max-width: 860px)");

const sheet = { el: $("sheet"), tab: "settings", snap: "half" };
function sheetSnaps() {
  const H = window.innerHeight;
  // Cap so brand bar + the map's min-height (96px) stay visible — otherwise the sheet bottom gets pushed off-screen
  const maxH = H - $("brand").offsetHeight - 96;
  const full = Math.min(Math.round(H * 0.9), maxH);
  return { peek: $("sheetBar").offsetHeight + 8, half: Math.min(Math.round(H * 0.52), full), full };
}
function setSheetHeight(px, animate = true) {
  const sn = sheetSnaps();
  const v = Math.max(sn.peek, Math.min(sn.full, px));
  sheet.el.classList.toggle("dragging", !animate);
  sheet.el.style.setProperty("--sheet-h", v + "px");
}
function snapSheet(name) { sheet.snap = name; setSheetHeight(sheetSnaps()[name]); }
function setSheetTab(name, { expand = true, snap = null } = {}) {
  sheet.tab = name;
  document.querySelectorAll(".stabs [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.panel === name));
  ["settings", "results"].forEach(n => $(n === "settings" ? "panelSettings" : "panelResults").classList.toggle("active", n === name));
  if (!isMobile()) return;
  if (snap) snapSheet(snap);
  else if (expand && sheet.snap === "peek") snapSheet("half");
}
document.querySelectorAll(".stabs [role=tab]").forEach(b => b.onclick = () => {
  if (sheet.tab === b.dataset.panel && sheet.snap === "peek") { snapSheet("half"); return; }
  setSheetTab(b.dataset.panel);

// Drag the sheet bar to resize (snaps to the nearest stop on release)
$("sheetBar").addEventListener("pointerdown", e => {
  if (!isMobile() || e.button !== 0) return;
  const bar = $("sheetBar"), y0 = e.clientY, h0 = sheet.el.getBoundingClientRect().height;
  let moved = false, lastY = y0, lastT = performance.now(), vel = 0;
  const move = ev => {
    const dy = ev.clientY - y0;
    if (!moved) {
      if (Math.abs(dy) <= 4) return;
      moved = true; bar.setPointerCapture(e.pointerId);   // capture only once movement starts → tab button clicks still work
    }
    const now = performance.now(); vel = (ev.clientY - lastY) / Math.max(1, now - lastT); lastY = ev.clientY; lastT = now;
    setSheetHeight(h0 - dy, false);
  };
  const up = ev => {
    bar.removeEventListener("pointermove", move);
    if (!moved) return;                                   // tab clicks are handled by the tab buttons
    const h = sheet.el.getBoundingClientRect().height, sn = sheetSnaps();
    let name;
    if (Math.abs(vel) > 0.5) name = vel < 0 ? (h > sn.half ? "full" : "half") : (h < sn.half ? "peek" : "half");   // fast flick → follow the direction
    else name = Object.entries(sn).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0];
    sheet.el.classList.remove("dragging");
    snapSheet(name);
  };
  bar.addEventListener("pointermove", move);
  bar.addEventListener("pointerup", up, { once: true });
  bar.addEventListener("pointercancel", up, { once: true });
});
let resizeT = null;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (isMobile()) snapSheet(sheet.snap); }, 120); });
mobileMQ.addEventListener("change", () => {
  if (!isMobile()) { sheet.el.style.removeProperty("--sheet-h"); ["panelSettings", "panelResults"].forEach(id => $(id).classList.remove("active")); $("panelSettings").classList.add("active"); }
  else setSheetTab(sheet.tab, { expand: false });
});
