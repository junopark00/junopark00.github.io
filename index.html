/* ---------- Links ---------- */
// Kakao map link: /link/from/<name>,<lat>,<lng>/to/<name>,<lat>,<lng> pre-fills both ends of the route
function routeUrl(p) {
  const to = `${encodeURIComponent(p.place_name)},${p.y},${p.x}`;
  if (!state.center) return `https://map.kakao.com/link/to/${to}`;
  const from = `${encodeURIComponent($("locHint").textContent || "출발지")},${state.center.lat},${state.center.lng}`;
  return `https://map.kakao.com/link/from/${from}/to/${to}`;
}

/* ---------- Drag handles (resize panes) ---------- */
const root = document.documentElement;
const splitPrefs = (() => { try { return JSON.parse(localStorage.getItem("jmc-split") || "{}"); } catch { return {}; } })();
function saveSplitPrefs() { try { localStorage.setItem("jmc-split", JSON.stringify(splitPrefs)); } catch {} }
function setMapH(px) {
  // On the desktop grid the map spans the brand row + the --map-h row → --map-h = actual height minus brand height
  const total = document.querySelector(".app").clientHeight, brandH = $("brand").offsetHeight;
  const v = Math.max(140, Math.min(total - brandH - 160, px - brandH));
  root.style.setProperty("--map-h", v + "px"); splitPrefs.mapH = v; saveSplitPrefs();
}
if (splitPrefs.mapH) root.style.setProperty("--map-h", splitPrefs.mapH + "px");

function makeDraggable(handle, { axis, get, set, reset, step, invert = false }) {
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const start = axis === "y" ? e.clientY : e.clientX, base = get();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("dragging"); document.body.classList.add("resizing");
    document.body.style.cursor = axis === "y" ? "row-resize" : "col-resize";
    const move = ev => set(base + (invert ? -1 : 1) * ((axis === "y" ? ev.clientY : ev.clientX) - start));
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.classList.remove("dragging"); document.body.classList.remove("resizing"); document.body.style.cursor = "";
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up, { once: true });
    handle.addEventListener("pointercancel", up, { once: true });
  });
  handle.addEventListener("dblclick", reset);
  handle.addEventListener("keydown", e => {
    const k = e.key;
    if (axis === "y" && (k === "ArrowUp" || k === "ArrowDown")) { e.preventDefault(); set(get() + (k === "ArrowDown" ? step : -step)); }
    if (axis === "x" && (k === "ArrowLeft" || k === "ArrowRight")) { e.preventDefault(); set(get() + (k === "ArrowRight" ? step : -step) * (invert ? -1 : 1)); }
    if (k === "Home" || k === "Enter") { e.preventDefault(); reset(); }
  });
}
makeDraggable($("splitH"), {
  axis: "y", step: 24,
  get: () => $("map").getBoundingClientRect().height,
  set: setMapH,
  reset: () => { root.style.removeProperty("--map-h"); delete splitPrefs.mapH; saveSplitPrefs(); },
});
/* ---------- Pick: slot-machine reel ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const REEL_ITEMS = 26;         // number of names that scroll past
const REEL_MS = 3000;          // spin duration
let rolling = false;
let reelRaf = null;

function setReel(names) {
  $("reelStrip").innerHTML = names.map(n => `<div class="reel-item"><span>${esc(n)}</span></div>`).join("");
  $("reelStrip").style.transform = "";
}
/* Actual walking time (TMAP via the worker) for the picked place only.
   On any failure — daily quota exhausted, network error — the straight-line
   estimate and its disclaimer stay as the fallback. */
const centerKey = () => state.center ? `${state.center.lat.toFixed(5)},${state.center.lng.toFixed(5)}` : "";
// Fetched times are also kept in localStorage for the day, so a reload or a
// history re-pick reuses them without spending TMAP quota.
const WALK_KEY = "jmc-walk";
function walkCacheGet(w) {
  const e = loadJSON(WALK_KEY, {})[w.id + "|" + centerKey()];
  return e && e.d === todayStr() ? e.s : null;
}
function walkCacheSet(w, sec) {
  const m = loadJSON(WALK_KEY, {});
  for (const k in m) if (m[k].d !== todayStr()) delete m[k];
  m[w.id + "|" + centerKey()] = { s: sec, d: todayStr() };
  saveJSON(WALK_KEY, m);
}
function realWalkSec(w) {
  if (w.walkSec && w.walkFrom === centerKey()) return w.walkSec;
  const s = walkCacheGet(w);
  if (s) { w.walkSec = s; w.walkFrom = centerKey(); return s; }
  return null;
}
function walkTimeLabel(w) {
  const s = realWalkSec(w);
  return s ? `걸어서 약 ${Math.max(1, Math.round(s / 60))}분` : travelLabel(w.distance);
}
async function fetchWalkTime(w) {
  if (!SEARCH_PROXY || !state.center || realWalkSec(w)) return;
  const from = centerKey();
  const refresh = () => { if (state.picked && state.picked.id === w.id) fillTicketMeta(w); };
  w.walkPending = true; refresh();
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const u = new URL(SEARCH_PROXY.replace(/\/$/, "").replace(/\/search$/, "") + "/route/pedestrian");
    u.searchParams.set("startX", state.center.lng); u.searchParams.set("startY", state.center.lat);
    u.searchParams.set("endX", w.x); u.searchParams.set("endY", w.y);
    const res = await fetch(u, { signal: ctl.signal });
    if (res.ok) {
      const b = await res.json();
      if (b.totalTime > 0) { w.walkSec = b.totalTime; w.walkFrom = from; walkCacheSet(w, b.totalTime); }
    }
  } catch {}
  clearTimeout(timer);
  w.walkPending = false; refresh();
}
function fillTicketMeta(w) {
  const walk = w.walkPending ? "도보 시간 확인 중…" : walkTimeLabel(w);
  const rate = w.rating && w.rating.count ? `<span>★ ${w.rating.avg.toFixed(1)} (${w.rating.count})</span>` : "";
  $("tMeta").innerHTML = `<span>${esc(shortCat(w.category_name))}</span><span>${fmtDist(w.distance)}</span><span>${esc(walk)}</span>${rate}`;
  // Show the straight-line disclaimer only when the estimate is what's displayed
  $("ticket").classList.toggle("real-walk", !!realWalkSec(w) || !!w.walkPending);
}
function fillTicket(winner) {
  state.picked = winner;
  fillTicketMeta(winner);
  fetchWalkTime(winner);
  $("tLink").href = winner.place_url; $("tRoute").href = routeUrl(winner);
  // recent + today's history
  state.recent = [winner.id, ...state.recent.filter(id => id !== winner.id)].slice(0, 3);
  state.history = [{ id: winner.id, place_name: winner.place_name, category_name: winner.category_name, distance: winner.distance, place_url: winner.place_url, x: winner.x, y: winner.y, road_address_name: winner.road_address_name, address_name: winner.address_name, phone: winner.phone },
    ...state.history.filter(h => h.id !== winner.id)].slice(0, 8);
  saveToday(); renderHistory(); refreshMarkerStyles();
  focusPlace(winner, false);   // pan the map to the winner, keep the list where it is
}
function setTicketState(st) { $("ticket").dataset.state = st; }
function showPicked(winner) {
  if (reelRaf) cancelAnimationFrame(reelRaf); reelRaf = null;
  rolling = false;
  setTicketState("done");
  $("tName").classList.remove("spinning", "landed");
  setReel([winner.place_name]);
  fillTicket(winner);
  setTicketBusy(false);
}
function setTicketBusy(v) { ["tReroll", "tSkip", "pick"].forEach(id => $(id).disabled = v); }

function pick(excludeId) {
  let pool = state.places.filter(p => p.id !== excludeId);
  if (!pool.length || rolling) return;
  // avoid the last few picks when there are enough alternatives
  const fresh = pool.filter(p => !state.recent.includes(p.id));
  if (fresh.length) pool = fresh;
  const winner = pool[Math.floor(Math.random() * pool.length)];
  if (isMobile()) { setSheetTab("results"); if (sheet.snap === "peek") snapSheet("half"); }
  $("ticket").scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  if (reduceMotion || pool.length < 3) { showPicked(winner); return; }

  // Reel layout: winner on top, random names below. Start showing the bottom and move up (text flows downward) until it stops on the winner
  const others = pool.filter(p => p.id !== winner.id);
  const names = [winner.place_name];
  let prev = winner.place_name;
  for (let i = 0; i < REEL_ITEMS; i++) {
    let cand; do { cand = others[Math.floor(Math.random() * others.length)].place_name; } while (cand === prev && others.length > 1);
    names.push(cand); prev = cand;
  }
  rolling = true; setTicketBusy(true);
  setTicketState("rolling");
  $("tMeta").innerHTML = `<span>돌아가는 중…</span>`;
  const reel = $("tName"), strip = $("reelStrip");
  reel.classList.remove("landed"); reel.classList.add("spinning");
  setReel(names);

  const itemH = strip.firstElementChild.getBoundingClientRect().height;
  const startY = -(names.length - 1) * itemH;   // position where the last name is visible
  const endY = 0;                                // position where the winner (first line) is visible
  strip.style.transform = `translateY(${startY}px)`;

  const easeOut = t => 1 - Math.pow(1 - t, 3.2);
  const t0 = performance.now(); let lastY = startY;
  const frame = now => {
    const t = Math.min(1, (now - t0) / REEL_MS);
    const y = startY + (endY - startY) * easeOut(t);
    const speed = Math.abs(y - lastY); lastY = y;
    strip.style.transform = `translateY(${y}px)`;
    strip.style.filter = speed > 6 ? `blur(${Math.min(5, (speed - 6) / 10)}px)` : "";
    if (t < 1) { reelRaf = requestAnimationFrame(frame); return; }
    strip.style.filter = "";
    reel.classList.remove("spinning"); reel.classList.add("landed");
    reelRaf = null; rolling = false;
    setTicketState("done");
    fillTicket(winner); setTicketBusy(false);
  };
  reelRaf = requestAnimationFrame(frame);
}
$("pick").onclick = () => pick();
$("tReroll").onclick = () => pick(state.picked?.id);
$("tSkip").onclick = () => {
  if (!state.picked) return;
  skipPlace(state.picked.place_name); pick();
};
$("tShare").onclick = () => sharePicked();

/* ---------- Today's pick history ---------- */
function renderHistory() {
  const box = $("history"), chips = $("historyChips");
  box.hidden = !state.history.length;
  chips.innerHTML = "";
  state.history.forEach(h => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip hist" + (state.picked && state.picked.id === h.id ? " cur" : "");
    b.textContent = h.place_name; b.title = "다시 이 가게로";
    b.onclick = () => { state.skips.delete(h.place_name); renderTokens(); applyFilter(); const live = state.all?.find(p => p.id === h.id) || h; showPicked(live); };
    chips.appendChild(b);
  });
}

/* ---------- Kakao login & star ratings ----------
   Ratings are stored per Kakao user in Worker KV; they are visible and writable
   only while logged in. Token exchange happens in the worker (REST key stays server-side). */
const WORKER_BASE = SEARCH_PROXY.replace(/\/$/, "").replace(/\/search$/, "");
const REDIRECT_URI = location.origin + location.pathname;
const AUTH_KEY = "jmc-auth", NUDGE_KEY = "jmc-login-nudge";
function authData() { return loadJSON(AUTH_KEY, null); }
function isLoggedIn() { const a = authData(); return !!(a && a.access && Date.now() < a.exp); }
function saveAuth(t) {
  saveJSON(AUTH_KEY, { provider: "kakao", who: "카카오 계정", access: t.access_token,
    refresh: t.refresh_token || (authData() || {}).refresh,
    exp: Date.now() + Math.max(60, (t.expires_in || 21600) - 60) * 1000 });
}
// atob() alone mangles UTF-8 (Korean names) — decode the base64 bytes properly
function jwtPayload(jwt) {
  try {
    const b64 = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
  } catch { return null; }
}
function saveGoogleAuth(cred) {   // cred is a Google ID token (JWT, ~1h lifetime, no refresh)
  const p = jwtPayload(cred) || {};
  saveJSON(AUTH_KEY, { provider: "google", who: p.name || p.email || "Google 계정", access: cred,
    exp: (p.exp ? p.exp * 1000 : Date.now() + 3300 * 1000) - 60000 });
}
/* In-app browsers (KakaoTalk, Instagram, Facebook, LINE …) block Google OAuth
   and often deny geolocation. Detect them and offer an escape to a real browser. */
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\//i.test(navigator.userAgent);
function openExternal() {
  const url = location.origin + location.pathname;
  const ua = navigator.userAgent;
  if (/KAKAOTALK/i.test(ua)) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua)) { location.href = url + "?openExternalBrowser=1"; return; }
  if (/Android/i.test(ua)) {
    location.href = "intent://" + location.host + location.pathname + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end";
    return;
  }
  toast("브라우저 메뉴(⋯)에서 '외부 브라우저로 열기'를 눌러주세요");
}
let gisInited = false;
function initGoogleBtn(tries = 0) {
  if (!window.google || !google.accounts) { if (tries < 40) setTimeout(() => initGoogleBtn(tries + 1), 250); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, auto_select: true, callback: res => {
    if (!res || !res.credential) return;
    saveGoogleAuth(res.credential);
    $("loginModal").hidden = true;
    toast("Google 로그인 완료!");
    updateAuthLine(); applyFilter(); fetchRatings();
  }});
  gisInited = true;
  renderGoogleBtn();   // in case the modal is already open
  // Google ID tokens last ~1h and can't refresh — One Tap silently re-issues one for returning users
  const a = authData();
  if (a && a.provider === "google" && !isLoggedIn() && !IN_APP) google.accounts.id.prompt();
}
function renderGoogleBtn() {
  if ($("loginModal").hidden) return;
  if (IN_APP) {   // Google blocks OAuth inside WebViews — offer the escape hatch instead
    $("googleBtn").innerHTML = `<button type="button" class="gbtn-fallback">외부 브라우저에서 Google 로그인</button>`;
    $("googleBtn").firstElementChild.onclick = openExternal;
    return;
  }
  // Render only while the modal is visible: the width has to be measured from the
  // live container, otherwise the button overflows the card
  if (!gisInited) return;
  const w = Math.min(360, Math.max(180, $("googleBtn").clientWidth || 280));
  $("googleBtn").innerHTML = "";
  google.accounts.id.renderButton($("googleBtn"), { theme: "outline", size: "large", width: w, text: "signin_with", locale: "ko" });
}
function logout() {
  localStorage.removeItem(AUTH_KEY);
  try { window.google && google.accounts && google.accounts.id.disableAutoSelect(); } catch {}
  updateAuthLine(); applyFilter();
  toast("로그아웃했어요");
}
function updateAuthLine() {
  const a = authData(), el = $("authLine");
  const who = (a && a.who) || "로그인";
  const short = who.length > 18 ? who.slice(0, 17) + "…" : who;   // keep the header row on one line
  el.innerHTML = isLoggedIn()
    ? `${esc(short)} · <button type="button" id="logoutBtn">로그아웃</button>`
    : `<button type="button" id="loginOpenBtn">로그인하고 별점 보기</button>`;
  const lo = document.getElementById("logoutBtn"); if (lo) lo.onclick = logout;
  const li = document.getElementById("loginOpenBtn"); if (li) li.onclick = showLoginModal;
}
function kakaoLogin() {
  if (!window.Kakao) { setStatus("카카오 로그인 SDK를 불러오지 못했어요.", true); return; }
  if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
  // Random state binds the redirect to this browser session (login-CSRF guard)
  const st = [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, "0")).join("");
  try { sessionStorage.setItem("jmc-oauth-state", st); } catch {}
  Kakao.Auth.authorize({ redirectUri: REDIRECT_URI, state: st });
}
async function refreshAuth() {
  const a = authData();
  if (!a || a.provider === "google" || !a.refresh) return false;   // Google ID tokens can't refresh — re-login instead
  try {
    const r = await fetch(WORKER_BASE + "/auth/token", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: a.refresh }) });
    if (!r.ok) return false;
    saveAuth(await r.json()); return true;
  } catch { return false; }
}
async function authFetch(url, opts = {}) {
  const call = () => fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + (authData() || {}).access } });
  let res = await call();
  if (res.status === 401 && await refreshAuth()) res = await call();
  if (res.status === 401) { localStorage.removeItem(AUTH_KEY); updateAuthLine(); }   // session truly over → back to logged-out UI
  return res;
}
async function handleAuthRedirect() {
  const sp = new URLSearchParams(location.search);
  const code = sp.get("code"), err = sp.get("error"), retState = sp.get("state");
  if (!code && !err) return;
  history.replaceState(null, "", location.pathname);
  if (err) { if (err !== "access_denied") toast("로그인에 실패했어요"); return; }   // user cancelled → stay quiet
  let saved = null;
  try { saved = sessionStorage.getItem("jmc-oauth-state"); sessionStorage.removeItem("jmc-oauth-state"); } catch {}
  if (!saved || retState !== saved) { toast("로그인 요청이 유효하지 않아요. 다시 시도해주세요."); return; }
  try {
    const r = await fetch(WORKER_BASE + "/auth/token", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }) });
    if (r.ok) { saveAuth(await r.json()); toast("카카오 로그인 완료!"); updateAuthLine(); applyFilter(); fetchRatings(); }
    else toast("로그인에 실패했어요");
  } catch { toast("로그인에 실패했어요"); }
}
function showLoginModal() { $("loginModal").hidden = false; renderGoogleBtn(); }
$("kakaoLoginBtn").onclick = kakaoLogin;
$("skipLoginBtn").onclick = () => { $("loginModal").hidden = true; saveJSON(NUDGE_KEY, todayStr()); };
$("loginModal").addEventListener("click", e => { if (e.target === $("loginModal")) $("skipLoginBtn").click(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("detailModal").hidden) { closeDetail(); return; }
  if (!$("loginModal").hidden) $("skipLoginBtn").click();
});
function maybeNudgeLogin() {
  const a = authData();
  if (isLoggedIn() || a) return;   // a stored session means a silent re-login is underway — don't flash the modal
  if (loadJSON(NUDGE_KEY, "") !== todayStr()) showLoginModal();
}

async function fetchRatings() {
  if (!isLoggedIn() || !state.all || !state.all.length) return;
  const byId = Object.fromEntries(state.all.map(p => [p.id, p]));
  const ids = Object.keys(byId);
  try {
    for (let i = 0; i < ids.length; i += 100) {
      const res = await authFetch(`${WORKER_BASE}/ratings?ids=${ids.slice(i, i + 100).join(",")}`);
      if (!res.ok) return;
      Object.entries(await res.json()).forEach(([id, r]) => { if (byId[id]) byId[id].rating = r; });
    }
    applyFilter();
  } catch {}
}
/* ---------- Place detail dialog: info, reviews, my rating ---------- */
const MIN_REVIEW = 10;
const starSpans = n => [1, 2, 3, 4, 5].map(i => `<span class="star${n >= i ? " on" : ""}">${ICON("star")}</span>`).join("");
let detailPlace = null, pickStars = 0;
function openDetail(p) {
  detailPlace = p; pickStars = 0;
  focusPlace(p, false);
  $("dName").textContent = p.place_name;
  $("dMeta").innerHTML = `${esc(shortCat(p.category_name))} · ${fmtDist(p.distance)} · ${esc(walkTimeLabel(p))}<br>` +
    `${esc(p.road_address_name || p.address_name || "")}${p.phone ? `<br>☎ ${esc(p.phone)}` : ""}`;
  $("dLink").href = p.place_url; $("dRoute").href = routeUrl(p);
  renderDetailBody(null);
  $("detailModal").hidden = false;
  if (isLoggedIn()) loadDetail(p);
}
function closeDetail() { $("detailModal").hidden = true; detailPlace = null; }
$("detailClose").onclick = closeDetail;
$("detailModal").addEventListener("click", e => { if (e.target === $("detailModal")) closeDetail(); });
function renderDetailBody(d) {
  const el = $("dBody");
  if (!isLoggedIn()) {
    el.innerHTML = `<div class="dsec dlogin"><button type="button" class="stars-locked" id="dLoginBtn">★ 로그인하고 별점·리뷰 보기</button></div>`;
    document.getElementById("dLoginBtn").onclick = () => { closeDetail(); showLoginModal(); };
    return;
  }
  if (!d) { el.innerHTML = `<div class="dsec"><small style="color:var(--ink-2)">별점 불러오는 중…</small></div>`; return; }
  const avgHtml = d.count
    ? `<div class="davg">${starSpans(Math.round(d.avg))} ${d.avg.toFixed(1)} <small>(${d.count}명)</small></div>`
    : `<div class="davg"><small>아직 별점이 없어요 — 첫 별점을 남겨보세요</small></div>`;
  const reviews = d.reviews && d.reviews.length
    ? d.reviews.map(rv => `<div class="review"><div class="rhead"><span class="rstars">${"★".repeat(rv.s)}</span>` +
        `<span class="rdate">${rv.at ? new Date(rv.at).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) : ""}</span>` +
        `${rv.mine ? `<span class="rmine">내 리뷰</span>` : ""}</div><div class="rtext">${esc(rv.t)}</div></div>`).join("")
    : `<small style="color:var(--ink-2);font-size:12.5px">아직 리뷰가 없어요</small>`;
  pickStars = pickStars || d.mine || 0;
  el.innerHTML = `
    <div class="dsec">${avgHtml}</div>
    <div class="dsec drate"><div class="dsec-t">내 별점 ${d.mine ? "고치기" : "남기기"}</div>
      <div class="rate-pick" id="ratePick">${[1, 2, 3, 4, 5].map(i =>
        `<button type="button" class="star${pickStars >= i ? " on" : ""}" data-star="${i}" aria-label="${i}점">${ICON("star")}</button>`).join("")}</div>
      <textarea id="reviewText" maxlength="500" placeholder="리뷰를 ${MIN_REVIEW}자 이상 적어주세요"></textarea>
      <div class="drate-foot"><small id="reviewHint"></small><button class="btn" id="reviewSubmit" type="button">등록</button></div>
      <div class="drate-notice">욕설·비방 등 악의적인 리뷰는 예고 없이 삭제될 수 있어요.</div>
    </div>
    <div class="dsec"><div class="dsec-t">최근 리뷰</div>${reviews}</div>`;
  const ta = document.getElementById("reviewText");
  ta.value = d.myText || "";
  const upd = () => {
    const len = ta.value.trim().length;
    document.getElementById("reviewHint").textContent =
      `${len}/${MIN_REVIEW}자 이상${pickStars ? ` · ★ ${pickStars}점` : " · 별점을 골라주세요"}`;
    document.getElementById("reviewSubmit").disabled = !pickStars || len < MIN_REVIEW;
  };
  document.querySelectorAll("#ratePick [data-star]").forEach(b => b.onclick = () => {
    pickStars = +b.dataset.star;
    document.querySelectorAll("#ratePick .star").forEach((s, i) => s.classList.toggle("on", i < pickStars));
    upd();
  });
  ta.addEventListener("input", upd);
  document.getElementById("reviewSubmit").onclick = submitReview;
  upd();
}
async function loadDetail(p) {
  try {
    const res = await authFetch(`${WORKER_BASE}/ratings/${p.id}`);
    if (!res.ok) return;
    const d = await res.json();
    p.rating = { avg: d.avg, count: d.count, mine: d.mine };
    if (detailPlace === p) renderDetailBody(d);
    if (state.picked && state.picked.id === p.id) fillTicketMeta(state.picked);
  } catch {}
}
async function submitReview() {
  const p = detailPlace; if (!p) return;
  const text = document.getElementById("reviewText").value.trim();
  if (!pickStars || text.length < MIN_REVIEW) return;
  document.getElementById("reviewSubmit").disabled = true;
  try {
    const res = await authFetch(`${WORKER_BASE}/ratings/${p.id}`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stars: pickStars, text }) });
    if (res.ok) { p.rating = await res.json(); toast(`★ ${pickStars}점 리뷰를 남겼어요`); loadDetail(p); applyFilter(); }
    else if (res.status === 401) { closeDetail(); showLoginModal(); }
    else toast("등록에 실패했어요");
  } catch { toast("등록에 실패했어요"); }
}
function sortPlaces() {
  const s = $("sortSel").value;
  state.places.sort({
    "dist-asc":  (a, b) => a.distance - b.distance,
    "dist-desc": (a, b) => b.distance - a.distance,
    "rate-desc": (a, b) => ((b.rating?.avg || 0) - (a.rating?.avg || 0)) || a.distance - b.distance,
    "rate-asc":  (a, b) => ((a.rating?.avg || 0) - (b.rating?.avg || 0)) || a.distance - b.distance,
  }[s] || ((a, b) => a.distance - b.distance));
}
$("sortSel").addEventListener("change", () => {
  if ($("sortSel").value.startsWith("rate") && !isLoggedIn()) { $("sortSel").value = "dist-asc"; showLoginModal(); return; }
  applyFilter(); savePrefs();
});

/* ---------- Share ---------- */
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }
async function sharePicked() {
  const w = state.picked; if (!w) return;
  const link = w.place_url;
  // No title, and the link only via url — share targets would otherwise print both twice
  const text = `오늘 점심은 ${w.place_name}!\n${shortCat(w.category_name)} · ${fmtDist(w.distance)} · ${walkTimeLabel(w)}`;
  try {
    if (navigator.share) { await navigator.share({ text, url: link }); return; }
    await navigator.clipboard.writeText(`${text}\n${link}`); toast("복사했어요");
  } catch (e) { if (e && e.name !== "AbortError") toast("공유할 수 없어요"); }
}


/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

/* ---------- Startup ---------- */
loadPersisted();
renderTokens(); updateRadiusHint(); renderHistory();
if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
initGoogleBtn();
{ const a = authData(); if (a && a.provider === "google" && a.access) saveGoogleAuth(a.access); }   // re-derive names saved with the old broken decoder
// Kakao sessions survive the ~6h access-token expiry: refresh silently on boot
(async () => {
  const a = authData();
  if (a && a.provider === "kakao" && a.refresh && !isLoggedIn()) {
    if (await refreshAuth()) { updateAuthLine(); applyFilter(); fetchRatings(); }
  }
})();
updateAuthLine();
handleAuthRedirect().then(maybeNudgeLogin);
if (isMobile()) setSheetTab("settings", { expand: false });
loadSdk(KAKAO_JS_KEY);
</script>
